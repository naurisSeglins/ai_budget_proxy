# fly.toml app configuration file generated for ai-budget-proxy on 2026-05-11T07:22:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-budget-proxy'
primary_region = 'ams'
console_command = '/rails/bin/rails console'

[build]

# Thrust (Rails 8's default HTTP front-end via bin/thrust) listens on port 80 by
# default. Containers run as the non-root 'rails' user (UID 1000), which cannot
# bind to ports < 1024 on Linux. Tell Thrust to listen on 8080 to match Fly's
# expected internal_port. Thrust still proxies to Rails on the default PORT (3000).

[env]
  HTTP_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep at least one machine running so the first request after idle time
  # doesn't hit a Thrust→Rails cold-start race (Thrust binds :8080 in <1s,
  # Rails needs ~15s to be ready on :3000; requests in that window get 502).
  # Costs ~$2/month for one always-on shared-cpu-1x VM. Worth it.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  size = 'shared-cpu-1x'
